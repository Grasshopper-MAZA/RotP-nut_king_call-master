description='''
Nut King Call - A JoJo Stand addon by Grasshopper.

This addon adds the Nut King Call Stand from JoJo's Bizarre Adventure Part 8: JoJolion to Ripples of the Past.

Nut King Call is the Stand of Josuke Higashikata (JoJolion). Its ability revolves around summoning screws and nails that can pin objects and people in place, or be fired as projectiles.

Features:
- Summon the Nut King Call Stand with a fully modeled 3D Blockbench model.
- Fire nails and nuts as projectiles that attach to enemies on hit.
- Pin enemies in place, or pin yourself to walls and the ground.
- Climb walls using nails.
- Quick Assembly / Disassembly - craft or break down items, including armor and tools, with a chance to lose materials.
- Flying Kick finisher and a full set of melee attacks.
- Custom animations, sounds, and particle effects.

Support me on Afdian:
https://ifdian.net/a/mazaNB666

Contact: 3848394903@qq.com
'''

